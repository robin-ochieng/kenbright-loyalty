<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#f57c00"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner shadow/highlight -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Letter K - stylized -->
  <path d="M 20 16 L 20 48 L 27 48 L 27 35 L 38 48 L 47 48 L 33 32 L 46 16 L 37 16 L 27 29 L 27 16 Z" fill="white"/>
  
  <!-- Accent dot/360 indicator -->
  <circle cx="48" cy="18" r="6" fill="url(#accentGradient)"/>
