version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: kenbright_360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 14120112
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - kenbright-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - kenbright-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:14120112@postgres:5432/kenbright_360
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - kenbright-network

volumes:
  postgres_data:

networks:
  kenbright-network:
    driver: bridge
